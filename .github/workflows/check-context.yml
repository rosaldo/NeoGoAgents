name: Check Prompt Context Budget

# Runs on every PR (no path filter) and on the branches that carry this fork.
# --strict-core is enabled since Task 17 split the oversized cores into
# <agent>.reference.md files, which convert.sh inlines into every integration.
on:
  pull_request:
  push:
    branches: [main, rosaldo, V2]

jobs:
  check-context:
    name: descriptions <= 140, catalog in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check context budget
        run: |
          chmod +x scripts/check-context.sh
          ./scripts/check-context.sh --strict-core
